[tools]
node = "lts"
pnpm = "latest"

[deps.pnpm]
auto = true

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.dev]
run = "pnpm dev"

[tasks.build]
run = "pnpm build"
sources = ["index.html", "src/**/*", "package.json"]
outputs = ["dist/**/*"]

[tasks.preview]
run = "pnpm preview"
depends = ["build"]
